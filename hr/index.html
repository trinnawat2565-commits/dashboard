<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ระบบบุคลากร รพ.สต.บ้านดงสวนพัฒนา</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>
<script src="js/backend.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column workbench. Header with live clock, tab bar, then the active view. Cards for staff on "today", dense tables elsewhere. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --sunk:#e9efed; --line:#d5dfdc;
  --fg:#15302b; --muted:#5b726d; --accent:#0f7a66; --accent-fg:#ffffff; --accent-soft:#dcefe9;
  --ok:#1f8a4c; --ok-soft:#dff3e6; --warn:#b4620a; --warn-soft:#fbecd8;
  --bad:#c0392b; --bad-soft:#f9e0dc; --info:#2d5fa8; --info-soft:#e0e9f7; --trip:#7a4bb0; --trip-soft:#ece3f7;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#16211f; --sunk:#1c2a27; --line:#2a3b37;
  --fg:#e3eeeb; --muted:#93aaa4; --accent:#3cc3a5; --accent-fg:#06201a; --accent-soft:#173a33;
  --ok:#55c987; --ok-soft:#173826; --warn:#f0a24d; --warn-soft:#3b2a14; --bad:#f07a6b; --bad-soft:#3d1d19;
  --info:#7fa9ec; --info-soft:#1b2a44; --trip:#b892e6; --trip-soft:#2c2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#16211f; --sunk:#1c2a27; --line:#2a3b37;
  --fg:#e3eeeb; --muted:#93aaa4; --accent:#3cc3a5; --accent-fg:#06201a; --accent-soft:#173a33;
  --ok:#55c987; --ok-soft:#173826; --warn:#f0a24d; --warn-soft:#3b2a14; --bad:#f07a6b; --bad-soft:#3d1d19;
  --info:#7fa9ec; --info-soft:#1b2a44; --trip:#b892e6; --trip-soft:#2c2140; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.unit .eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.clock{text-align:right}
.clock .t{font-family:var(--f-mono);font-size:2.3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{color:var(--muted);font-size:.9rem}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto}
nav.tabs a{flex:1 0 auto;text-align:center;padding:8px 14px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--fg);padding:10px 14px;border-radius:var(--r);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .n{font-family:var(--f-mono);font-size:1.7rem;font-weight:600;line-height:1.1}
.kpi .l{font-size:.85rem;color:var(--muted)}
.kpi.ok .n{color:var(--ok)} .kpi.warn .n{color:var(--warn)} .kpi.bad .n{color:var(--bad)} .kpi.info .n{color:var(--info)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .who{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .name{font-weight:600}
.card .pos{font-size:.85rem;color:var(--muted)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times div{background:var(--sunk);border-radius:8px;padding:6px 10px}
.times small{display:block;font-size:.75rem;color:var(--muted)}
.times b{font-family:var(--f-mono);font-size:1.1rem;font-weight:600}
.acts{display:flex;gap:8px}
.acts button{flex:1}
button,.btn{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px;max-width:100%}
input[type="time"]{font-family:var(--f-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-trip{background:var(--trip-soft);color:var(--trip)} .p-none{background:var(--sunk);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;font-size:.8rem;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.cal td,.cal th{padding:4px 2px;text-align:center;min-width:26px}
.cal td.nm,.cal th.nm{text-align:left;padding:4px 10px;position:sticky;left:0;background:var(--surface);z-index:1}
.cal th.nm{background:var(--sunk)}
.c{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-size:.72rem;font-weight:600}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-late{background:var(--warn-soft);color:var(--warn)}
.c-abs{background:var(--bad-soft);color:var(--bad)} .c-leave{background:var(--info-soft);color:var(--info)}
.c-trip{background:var(--trip-soft);color:var(--trip)} .c-off{background:transparent;color:var(--line)} .c-pend{background:var(--sunk);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{margin:0;max-width:46ch}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form-row .grow{flex:1 1 200px}
.form-row .grow input{width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);z-index:20}
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .4);display:grid;place-items:center;z-index:30;padding:16px}
.sheet .box{background:var(--surface);border-radius:14px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.sheet .big{font-family:var(--f-mono);font-size:2.2rem;font-weight:600;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
ul.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.alerts li{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
a{color:var(--accent)}
.seg button{min-height:34px;padding:4px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:180px;overflow:auto}
.chk label{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--fg)}
td.wt{white-space:normal;min-width:180px;max-width:320px}
.sub{font-size:.8rem;color:var(--muted)}
.quota{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--sunk);vertical-align:middle;margin-left:6px;overflow:hidden}
.quota i{display:block;height:100%;background:var(--accent)}
.quota.over i{background:var(--bad)}

/* ---- colour layer: each section has its own hue (--sec), people get their own hue (--h) ---- */
:root{--sec:168; --tintL:93%; --tintS:70%; --fillL:38%; --fillFg:#fff; --avBg:86%; --avFg:28%; --cardTint:95%;
  --blob1:hsl(168 70% 80% / .45); --blob2:hsl(42 95% 80% / .45); --blob3:hsl(330 85% 88% / .35);
  --hero1:#0b6b5c; --hero2:#16a07a; --hero3:#f2b23e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tintL:17%; --tintS:45%; --fillL:58%; --fillFg:#0b1513; --avBg:26%; --avFg:80%; --cardTint:16%;
  --blob1:hsl(168 60% 30% / .25); --blob2:hsl(42 80% 35% / .18); --blob3:hsl(330 60% 35% / .15); --hero1:#0a4a40; --hero2:#0f7a5e; --hero3:#a8741d}}
:root[data-theme="dark"]{--tintL:17%; --tintS:45%; --fillL:58%; --fillFg:#0b1513; --avBg:26%; --avFg:80%; --cardTint:16%;
  --blob1:hsl(168 60% 30% / .25); --blob2:hsl(42 80% 35% / .18); --blob3:hsl(330 60% 35% / .15); --hero1:#0a4a40; --hero2:#0f7a5e; --hero3:#a8741d}
body{background-color:var(--bg);background-image:radial-gradient(circle at 0% 0%,var(--blob1),transparent 38%),radial-gradient(circle at 100% 8%,var(--blob2),transparent 34%),radial-gradient(circle at 60% 100%,var(--blob3),transparent 40%);background-attachment:fixed}
header.top{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;color:#fff;
  background:radial-gradient(circle at 92% 18%,rgb(255 255 255 / .22) 0 60px,transparent 61px),radial-gradient(circle at 78% 120%,rgb(255 255 255 / .14) 0 90px,transparent 91px),linear-gradient(120deg,var(--hero1),var(--hero2) 60%,var(--hero3))}
header.top .eyebrow{color:#fff;opacity:.85}
header.top .muted,header.top .clock .d{color:rgb(255 255 255 / .85)}
header.top h1{font-size:1.6rem}
nav.tabs{background:var(--surface);border:1px solid var(--line);padding:6px;gap:6px}
nav.tabs a{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--fg)}
nav.tabs a::before{content:"";width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 70% 50%);flex:none}
nav.tabs a:hover{background:hsl(var(--h) var(--tintS) var(--tintL))}
nav.tabs a[aria-current="page"]{background:hsl(var(--h) 62% var(--fillL));color:var(--fillFg);box-shadow:0 4px 12px hsl(var(--h) 60% 40% / .3)}
nav.tabs a[aria-current="page"]::before{background:var(--fillFg)}
.kpi{border:0;background:hsl(var(--sec) var(--tintS) var(--tintL));padding:14px 16px}
.kpi .n{font-size:2rem}
.kpi.ok{background:var(--ok-soft)} .kpi.warn{background:var(--warn-soft)} .kpi.bad{background:var(--bad-soft)} .kpi.info{background:var(--info-soft)}
.kpi .n{color:hsl(var(--sec) 60% var(--fillL))}
.kpi.ok .n{color:var(--ok)} .kpi.warn .n{color:var(--warn)} .kpi.bad .n{color:var(--bad)} .kpi.info .n{color:var(--info)}
button.primary{background:hsl(var(--sec) 62% var(--fillL));border-color:transparent;color:var(--fillFg)}
button.primary:hover{filter:brightness(1.08);border-color:transparent}
h2{display:flex;align-items:center;gap:8px}
.panel > h2::before,.bar > h2::before{content:"";width:10px;height:10px;border-radius:3px;background:hsl(var(--sec) 65% 50%);flex:none}
.seg button[aria-pressed="true"]{background:hsl(var(--sec) var(--tintS) var(--tintL));border-color:hsl(var(--sec) 60% 45%);color:hsl(var(--sec) 60% var(--fillL))}
th{background:hsl(var(--sec) var(--tintS) var(--tintL))}
.cal th.nm{background:hsl(var(--sec) var(--tintS) var(--tintL))}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:1rem;background:hsl(var(--h) 75% var(--avBg));color:hsl(var(--h) 60% var(--avFg))}
.av.sm{width:30px;height:30px;font-size:.8rem}
.card{background:linear-gradient(180deg,hsl(var(--h) 80% var(--cardTint)) 0,var(--surface) 90px);border-color:hsl(var(--h) 40% 80% / .6)}
.who-l{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 170px}
.card .who{flex-wrap:wrap}
@media (min-width:720px){nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);overflow-x:visible}}
.nm-cell{display:flex;gap:8px;align-items:center}

/* ---- vivid layer: saturated gradient tiles with white text, like printed benefit cards ---- */
:root{--hero1:#0d47a1; --hero2:#1976d2; --hero3:#00acc1;
  --g-teal:linear-gradient(135deg,#00897b,#26c6a6); --g-green:linear-gradient(135deg,#2e9d3a,#7cc242);
  --g-orange:linear-gradient(135deg,#ef6c00,#ffa726); --g-blue:linear-gradient(135deg,#1565c0,#42a5f5);
  --g-red:linear-gradient(135deg,#d81b60,#ff5c8a); --g-purple:linear-gradient(135deg,#6a1b9a,#ab47bc);
  --blob1:hsl(205 90% 85% / .45); --blob2:hsl(45 100% 80% / .35); --blob3:hsl(330 90% 88% / .3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero1:#0a2f6b; --hero2:#12579e; --hero3:#00838f;
  --blob1:hsl(210 70% 30% / .25); --blob2:hsl(40 80% 30% / .15); --blob3:hsl(330 60% 30% / .15)}}
:root[data-theme="dark"]{--hero1:#0a2f6b; --hero2:#12579e; --hero3:#00838f;
  --blob1:hsl(210 70% 30% / .25); --blob2:hsl(40 80% 30% / .15); --blob3:hsl(330 60% 30% / .15)}
.kpi{background:linear-gradient(135deg,hsl(var(--sec) 70% 36%),hsl(var(--sec) 75% 52%));color:#fff;box-shadow:0 6px 16px hsl(var(--sec) 60% 35% / .25);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:rgb(255 255 255 / .16)}
.kpi.ok{background:var(--g-green);box-shadow:0 6px 16px rgb(46 157 58 / .28)}
.kpi.warn{background:var(--g-orange);box-shadow:0 6px 16px rgb(239 108 0 / .28)}
.kpi.bad{background:var(--g-red);box-shadow:0 6px 16px rgb(216 27 96 / .28)}
.kpi.info{background:var(--g-blue);box-shadow:0 6px 16px rgb(21 101 192 / .28)}
.kpi .n,.kpi.ok .n,.kpi.warn .n,.kpi.bad .n,.kpi.info .n{color:#fff}
.kpi .l,.kpi .l .sub{color:rgb(255 255 255 / .92)}
nav.tabs a[aria-current="page"]{background:linear-gradient(135deg,hsl(var(--h) 72% 38%),hsl(var(--h) 78% 52%));color:#fff}
nav.tabs a[aria-current="page"]::before{background:#fff}
button.primary{background:linear-gradient(135deg,hsl(var(--sec) 72% 38%),hsl(var(--sec) 78% 50%));color:#fff;box-shadow:0 3px 8px hsl(var(--sec) 60% 35% / .25)}
.av{background:linear-gradient(135deg,hsl(var(--h) 72% 40%),hsl(var(--h) 80% 56%));color:#fff;box-shadow:0 3px 8px hsl(var(--h) 60% 35% / .3)}
.card{background:var(--surface);border:1px solid var(--line);border-top:0;overflow:hidden;padding-top:0;box-shadow:0 4px 14px rgb(0 0 0 / .06)}
.card::before{content:"";display:block;height:8px;margin:0 -14px 4px;background:linear-gradient(90deg,hsl(var(--h) 72% 40%),hsl(var(--h) 80% 58%))}
th{background:hsl(var(--sec) 68% 40%);color:#fff}
.cal th.nm{background:hsl(var(--sec) 70% 36%)}
.cal th.muted{color:rgb(255 255 255 / .6)}
.panel > h2::before,.bar > h2::before{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,hsl(var(--sec) 72% 40%),hsl(var(--sec) 80% 56%))}
.pill.p-ok{background:#2e9d3a;color:#fff} .pill.p-warn{background:#ef6c00;color:#fff} .pill.p-bad{background:#d81b60;color:#fff}
.pill.p-info{background:#1976d2;color:#fff} .pill.p-trip{background:#8e24aa;color:#fff}
.c-ok{background:#2e9d3a;color:#fff} .c-late{background:#ef6c00;color:#fff} .c-abs{background:#d81b60;color:#fff} .c-leave{background:#1976d2;color:#fff} .c-trip{background:#8e24aa;color:#fff}
.brand{display:flex;gap:16px;align-items:center;min-width:0;position:relative;z-index:1}
.logo{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid rgb(255 255 255 / .85);box-shadow:0 6px 16px rgb(0 0 0 / .25);flex:none;object-fit:cover}
@media (max-width:520px){.logo{width:62px;height:62px}}
header.top .clock{position:relative;z-index:1}
.avbtn{position:relative;padding:0;border:0;background:none;min-height:0;border-radius:50%;cursor:pointer;flex:none;line-height:0}
.avbtn:hover{border:0}
.avbtn .cam{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--fg);border:1px solid var(--line);font-size:13px;line-height:16px;font-weight:700;display:grid;place-items:center}
.av.sm + .cam{width:14px;height:14px;font-size:11px;line-height:12px}
img.av{object-fit:cover;padding:0}
.card .av:not(.sm){width:54px;height:54px;font-size:1.15rem}
.av.lg{width:140px;height:140px;font-size:3rem}
textarea{font:inherit;width:100%;min-height:120px;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (prefers-reduced-motion: no-preference){button{transition:border-color .15s}}
.login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,hsl(168 70% 92%),hsl(212 80% 93%) 50%,hsl(330 75% 94%))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login{background:linear-gradient(135deg,hsl(168 40% 12%),hsl(212 40% 14%) 50%,hsl(330 35% 14%))}}
:root[data-theme="dark"] .login{background:linear-gradient(135deg,hsl(168 40% 12%),hsl(212 40% 14%) 50%,hsl(330 35% 14%))}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgb(0 0 0/.12)}
.login-card select,.login-card input{font:inherit;font-size:1rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);width:100%}

function status(staff, k, log){
  const todayK = dkey(new Date());
  if(log && log.leave) return {code:isTrip(log.leave)?"trip":"leave", label:log.leave, cls:isTrip(log.leave)?"p-trip":"p-info"};
  if(staff.since && k < staff.since) return {code:"off", label:"—", cls:"p-none"};
  const rq = reqOn(staff.id, k);
  if(rq && rq.kind==="trip" && !(log && log.in)) return {code:"trip", label:"ไปราชการ", cls:"p-trip"};
  if(rq && rq.kind==="leave" && (rq.half==="full" || !rq.half || !(log && log.in))) return {code:"leave", label:rq.leaveType, cls:"p-info"};
  if(rq && rq.kind==="leave" && log && log.in) return {code:"ok", label:"มา + "+rq.leaveType+"ครึ่งวัน", late:0, early:0, cls:"p-info"};
  if(log && log.in){
    const late = toMin(log.in) - (toMin(S.settings.start) + Number(S.settings.grace||0));
    const early = log.out ? toMin(S.settings.end) - toMin(log.out) : 0;
    if(late>0) return {code:"late", label:"สาย "+late+" นาที", late, early, cls:"p-warn"};
    return {code:"ok", label: early>0 ? "ออกก่อน "+early+" นาที" : "มาปฏิบัติงาน", late:0, early, cls: early>0?"p-warn":"p-ok"};
  }
  if(!isWorkday(k)) return {code:"off", label:"วันหยุด", cls:"p-none"};
  if(k > todayK) return {code:"off", label:"—", cls:"p-none"};
  if(k === todayK && toMin(hm(new Date())) < toMin(S.settings.end)) return {code:"pend", label:"ยังไม่ลงเวลา", cls:"p-none"};
  return {code:"abs", label:"ขาด/ไม่ลงเวลา", cls:"p-bad"};
}

  const id = k+"_"+staffId;
  const cur = S.today[id] || S.month[id] || (S.daily||{})[id] || {};
  const body = {...cur, ...patch, date:k, staffId, updatedAt:new Date().toISOString()};
  Object.keys(body).forEach(x => { if(body[x]===null || body[x]==="") delete body[x]; });
  if(S.demo){ if(k===dkey(new Date())) S.today[id]=body; if(k.slice(0,7)===S.monthKey) S.month[id]=body; if(k===S.dailyKey) (S.daily=S.daily||{})[id]=body; render(); return; }
  try { await S.db.doc("logs/"+id).set(body); }
  catch(e){ handleWriteError(e); throw e; }
}

function monthStats(){
  const [a,b] = monthRange(S.monthKey); const days = [];
  for(let d=parseKey(a); dkey(d)<=b; d.setDate(d.getDate()+1)) days.push(dkey(d));
  const rows = S.staff.map(s => {
    const r = {s, cells:[], work:0, ok:0, late:0, lateMin:0, abs:0, leave:0, trip:0, early:0};
    days.forEach(k => {
      const log = logOf(S.month,k,s.id), x = status(s,k,log); r.cells.push({k,x,log});
      if(isWorkday(k) && k<=dkey(new Date()) && !(s.since && k<s.since)) r.work++;
      if(x.code==="ok"){ r.ok++; if(x.early>0) r.early++; }
      if(x.code==="late"){ r.ok++; r.late++; r.lateMin += x.late; if(x.early>0) r.early++; }
      if(x.code==="abs") r.abs++;
      if(x.code==="leave") r.leave++;
      if(x.code==="trip") r.trip++;
    });
    return r;
  });
  return {days, rows};
}
const CELL = {ok:["c-ok","✓"], late:["c-late","ส"], abs:["c-abs","ข"], leave:["c-leave","ล"], trip:["c-trip","ร"], off:["c-off","·"], pend:["c-pend","?"]};

  <div class="legend"><span><i class="c c-ok">✓</i>มา</span><span><i class="c c-late">ส</i>สาย</span><span><i class="c c-leave">ล</i>ลา</span><span><i class="c c-trip">ร</i>ไปราชการ/อบรม</span><span><i class="c c-abs">ข</i>ขาด/ไม่ลงเวลา</span><span><i class="c c-pend">?</i>ยังไม่ลงเวลา</span></div>

function usedDays(staffId, fy){
  const [a,b] = fyRange(fy), u = {};
  S.requests.filter(r => r.kind==="leave" && r.status==="approved" && (r.staffIds||[]).includes(staffId) && r.to>=a && r.from<=b).forEach(r => {
    let d = 0; if(r.half && r.half!=="full") d = 0.5; else eachDay(r.from<a?a:r.from, r.to>b?b:r.to, k => { if(isWorkday(k)) d++; });
    u[r.leaveType] = (u[r.leaveType]||0) + d;
  });
  return u;
}
function updCalc(){
  const el = document.getElementById("rCalc"); if(!el) return;
  const a = $("#rFrom")?.value, b = $("#rTo")?.value, half = $("#rHalf")?.value;
  if(!a || !b){ el.textContent = ""; return; }
  if(b < a){ el.textContent = "วันที่สิ้นสุดต้องไม่ก่อนวันเริ่ม"; return; }
  if(view()==="trip"){ el.textContent = `รวม ${calDays(a,b)} วัน`; return; }
  el.textContent = half && half!=="full" ? "รวม 0.5 วันทำการ" : `รวม ${workdays(a,b)} วันทำการ (ไม่นับเสาร์-อาทิตย์และวันหยุด)`;
}
const fmtD = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

function licState(l){ const d = daysUntil(l.expires); if(d<0) return {d, label:"หมดอายุแล้ว", cls:"p-bad"}; if(d<=90) return {d, label:`อีก ${d} วัน`, cls:"p-warn"}; return {d, label:"ใช้ได้", cls:"p-ok"}; }
function ymd(a,b){ // years, months between date keys
  const A = parseKey(a), B = parseKey(b); let y = B.getFullYear()-A.getFullYear(), m = B.getMonth()-A.getMonth();
  if(B.getDate() < A.getDate()) m--; if(m<0){ y--; m+=12; } return {y, m};
}

}
async function setDutySlots(mk, slots){
  return saveDoc("duty/"+mk, {slots}, () => { S.duty[mk] = {slots}; });

function dutyAutoFill(mk){
  const slots = JSON.parse(JSON.stringify(dutySlots(mk))), per = Number(S.settings.dutyPerDay||1), wdOn = S.settings.dutyWeekday !== false;
  const cnt = {}; S.staff.forEach(s => cnt[s.id] = 0);
  Object.values(slots).forEach(ids => ids.forEach(id => { if(id in cnt) cnt[id]++; }));
  let added = 0;
  eachDay(...monthRange(mk), k => {
    if(!wdOn && isWorkday(k)) return;
    const ids = slots[k] || [];
    while(ids.length < per){
      const c = S.staff.filter(s => !ids.includes(s.id) && !reqOn(s.id,k) && !(s.since && k < s.since) && s.noDuty !== true).sort((a,b) => cnt[a.id]-cnt[b.id] || (a.order??0)-(b.order??0))[0];
      if(!c) break; ids.push(c.id); cnt[c.id]++; added++;
    }
    if(ids.length) slots[k] = ids;
  });
  return {slots, added};
}

/* ---------- evaluation ---------- */
function roundRange(key){ const [fy,r] = key.split("-").map(Number); return r===1 ? [(fy-1)+"-10-01", fy+"-03-31"] : [fy+"-04-01", fy+"-09-30"]; }
function curRound(){ const k = dkey(new Date()), fy = fyOf(k), m = Number(k.slice(5,7)); return fy+"-"+((m>=10||m<=3)?1:2); }
function roundLabel(key){ const [fy,r] = key.split("-").map(Number); return `ปีงบ ${fyBE(fy)} รอบที่ ${r} (${r===1?"1 ต.ค. – 31 มี.ค.":"1 เม.ย. – 30 ก.ย."})`; }
function evalLevel(t){ if(t>=90) return ["ดีเด่น","p-ok"]; if(t>=80) return ["ดีมาก","p-ok"]; if(t>=70) return ["ดี","p-info"]; if(t>=60) return ["พอใช้","p-warn"]; return ["ต้องปรับปรุง","p-bad"]; }
async function loadEval(){
  const key = S.evalRound; if(S.evalLoading===key) return; S.evalLoading = key;
  const [a,b0] = roundRange(key), b = b0 < dkey(new Date()) ? b0 : dkey(new Date());
  let logs = {};
  if(S.demo) logs = {...S.month};
  else if(S.db && a<=b){
    try {
      const months = []; for(let d=parseKey(a); dkey(d)<=b; d.setMonth(d.getMonth()+1)) months.push(dkey(d).slice(0,7));
      for(const mk of months){ const [x,y] = monthRange(mk); const snap = await S.db.collection("logs").where("date",">=",x).where("date","<=",y).get(); snap.docs.forEach(d => logs[d.id] = d.data()); }
    } catch(e){ console.warn(e); }
  }
  if(S.evalRound===key){ S.evalLogs = logs; S.evalLogsKey = key; }
  S.evalLoading = null;
  if(S.db && !S.demo) sub("evals", () => S.db.collection("evals").where("round","==",key).onSnapshot(s => { S.evals = {}; s.docs.forEach(d => S.evals[d.id] = d.data()); render(); }, console.warn));
  render();
}
function vEval(){
  if(!S.ready) return loadingView();
  if(!S.isAdmin) return `<div class="empty"><h2>เฉพาะผู้ดูแลระบบ</h2><p class="muted">ผลการประเมินเห็นและแก้ไขได้เฉพาะผู้ดูแลระบบ (สิทธิ์ admin ในชีต ผู้ใช้)</p></div>`;
  if(!S.staff.length) return emptyStaff();
  const key = S.evalRound;
  if(S.evalLogsKey !== key){ setTimeout(loadEval, 0); }
  const [a,b0] = roundRange(key), todayK = dkey(new Date()), b = b0 < todayK ? b0 : todayK;
  const cur = curRound(), [cfy] = cur.split("-").map(Number);
  const rounds = []; for(let fy=cfy; fy>=cfy-1; fy--) for(const r of [2,1]){ const k = fy+"-"+r; if(k<=cur) rounds.push(k); }
  const ready = S.evalLogsKey === key;
  const stat = s => {
    const o = {sickN:0,sickD:0,bizN:0,bizD:0,vacD:0,late:0,abs:0,hours:0};
    S.requests.filter(r => r.kind==="leave" && r.status==="approved" && (r.staffIds||[]).includes(s.id) && r.to>=a && r.from<=b0).forEach(r => {
      let d = 0; if(r.half && r.half!=="full") d = 0.5; else eachDay(r.from<a?a:r.from, r.to>b0?b0:r.to, k => { if(isWorkday(k)) d++; });
      if(r.leaveType==="ลาป่วย"){ o.sickN++; o.sickD+=d; } else if(r.leaveType==="ลากิจส่วนตัว"){ o.bizN++; o.bizD+=d; } else if(r.leaveType==="ลาพักผ่อน") o.vacD+=d;
    });
    if(ready && a<=b) eachDay(a, b, k => { const x = status(s, k, S.evalLogs[k+"_"+s.id]); if(x.code==="late") o.late++; if(x.code==="abs") o.abs++; });
    S.trainings.filter(t => (t.staffIds||[]).includes(s.id) && t.from>=a && t.from<=b0).forEach(t => o.hours += Number(t.hours||0));
    return o;
  };
  const ev = id => S.evals[key+"_"+id] || {};
  return `
  <div class="bar"><h2>ประเมินผลการปฏิบัติงาน</h2>
    <div class="grp"><select id="evRound" aria-label="รอบการประเมิน">${rounds.map(k=>`<option value="${k}" ${k===key?"selected":""}>${esc(roundLabel(k))}</option>`).join("")}</select><button data-act="evalCsv">ส่งออก CSV</button></div></div>
  <p class="sub" style="margin:0">ข้อมูลการลา มาสาย ขาด และชั่วโมงอบรม ดึงจากระบบให้อัตโนมัติ กรอกคะแนนผลสัมฤทธิ์ของงาน (เต็ม 70) และพฤติกรรม/สมรรถนะ (เต็ม 30) แล้วระบบบันทึกทันที ${ready?"":" · กำลังโหลดข้อมูลการลงเวลา…"}</p>
  <div class="tbl-wrap"><table><thead><tr><th>ชื่อ-สกุล</th><th class="num">ลาป่วย<br>ครั้ง/วัน</th><th class="num">ลากิจ<br>ครั้ง/วัน</th><th class="num">ลาพักผ่อน<br>วัน</th><th class="num">สาย<br>ครั้ง</th><th class="num">ขาด<br>วัน</th><th class="num">อบรม<br>ชม.</th><th>ผลสัมฤทธิ์<br>/70</th><th>สมรรถนะ<br>/30</th><th class="num">รวม</th><th>ระดับ</th><th>หมายเหตุ</th></tr></thead><tbody>
  ${S.staff.map(s => { const o = stat(s), e = ev(s.id); const has = e.work!=null || e.comp!=null; const tot = Number(e.work||0)+Number(e.comp||0); const [lv,lc] = evalLevel(tot);
    const flag = o.sickD+o.bizD > 23 ? `<span class="pill p-bad">ลาป่วย+กิจเกิน 23 วัน</span>` : "";
    return `<tr><td>${esc(s.name)}${flag?"<br>"+flag:""}</td><td class="num">${o.sickN?`${o.sickN}/${fmtD(o.sickD)}`:"–"}</td><td class="num">${o.bizN?`${o.bizN}/${fmtD(o.bizD)}`:"–"}</td><td class="num">${o.vacD?fmtD(o.vacD):"–"}</td>
    <td class="num">${ready?(o.late||"–"):"…"}</td><td class="num">${ready?(o.abs||"–"):"…"}</td><td class="num">${o.hours?fmtD(o.hours):"–"}</td>
    <td><input type="number" min="0" max="70" step="0.5" data-ev="work" data-id="${s.id}" value="${e.work??""}" style="width:80px" aria-label="ผลสัมฤทธิ์ ${esc(s.name)}"></td>
    <td><input type="number" min="0" max="30" step="0.5" data-ev="comp" data-id="${s.id}" value="${e.comp??""}" style="width:80px" aria-label="สมรรถนะ ${esc(s.name)}"></td>
    <td class="num"><b>${has?fmtD(tot):"–"}</b></td><td>${has?`<span class="pill ${lc}">${lv}</span>`:""}</td>
    <td><input data-ev="note" data-id="${s.id}" value="${esc(e.note||"")}" style="min-width:160px" aria-label="หมายเหตุ ${esc(s.name)}"></td></tr>`; }).join("")}
  </tbody></table></div>
  <p class="sub" style="margin:0">ระดับผลการประเมิน: ดีเด่น 90–100 · ดีมาก 80–89 · ดี 70–79 · พอใช้ 60–69 · ต้องปรับปรุง ต่ำกว่า 60 · เงื่อนไขวันลาสำหรับการเลื่อนเงินเดือนให้ตรวจสอบกับระเบียบล่าสุดอีกครั้ง</p>`;
}

  S.programs.forEach(p => { const away = p.owner && onAwayToday(p.owner); if(away) items.push(`<li><span class="pill p-info">${esc(away)}</span> ${esc(nameOf(p.owner))} ผู้รับผิดชอบ${esc(p.name)} · ${p.backup && !onAwayToday(p.backup) ? "ติดต่อผู้ทำแทน "+esc(nameOf(p.backup)) : "ยังไม่มีผู้ทำแทน"}</li>`); });
  const pr = pendingTripReports(); if(pr.length) items.push(`<li><span class="pill p-warn">ยังไม่ส่งสรุป</span> ไปราชการ ${pr.length} เรื่องที่ยังไม่มีรายงานสรุป <a href="#report">เขียนสรุป</a></li>`);
  const bd = S.staff.filter(s => s.birth && s.birth.slice(5)===k.slice(5));

let rendering = false, renderAgain = false;
function render(){
  if(rendering){ renderAgain = true; return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
  if(renderAgain){ renderAgain = false; setTimeout(render, 0); }
}
function renderNow(){

  const pend = kind => S.requests.filter(r=>r.kind===kind && r.status==="pending").length;
  [["#badgeLeave","leave"],["#badgeTrip","trip"]].forEach(([sel,kd]) => { const n = pend(kd); $(sel).innerHTML = n ? ` <span class="pill p-warn" style="padding:0 7px">${n}</span>` : ""; });
  { const n = pendingTripReports().length; $("#badgeRep").innerHTML = n ? ` <span class="pill p-warn" style="padding:0 7px">${n}</span>` : ""; }
  { const n = S.licenses.filter(l => S.staff.some(s=>s.id===l.staffId) && licState(l).d<=90).length; $("#badgeStaff").innerHTML = n ? ` <span class="pill p-bad" style="padding:0 7px">${n}</span>` : ""; }

  let b = "";
  if(S.demo) b = `<div class="banner"><span><b>โหมดตัวอย่าง</b> ข้อมูลและรายชื่อในหน้านี้สมมติขึ้นเพื่อดูการทำงานเท่านั้น ไม่มีการบันทึกจริง</span><button data-act="exitDemo">ออกจากโหมดตัวอย่าง</button></div>`;
    else if(!S.canWrite) b = `<div class="banner"><span>บัญชีนี้ดูข้อมูลได้อย่างเดียว ขอสิทธิ์ “ผู้ร่วมแก้ไข (Contributor)” จากผู้ดูแลเพื่อลงเวลา</span></div>`;
  $("#banner").innerHTML = b;
  { const m = window.HR.me(); $("#whoMe").innerHTML = S.demo ? `<button class="ghost" data-act="exitDemo">ออกจากตัวอย่าง</button>` : m && S.db ? `<span class="muted">${esc(m.name)}${m.role==="admin"?" · ผู้ดูแล":""}</span><button class="ghost" data-act="logout">ออกจากระบบ</button>` : ""; }
  const keep = {}; document.querySelectorAll("#view [data-keep] input[id], #view [data-keep] select[id], #view [data-keep] textarea[id]").forEach(el => { keep[el.id] = el.type==="checkbox" ? el.checked : el.value; });
  const active = document.activeElement && document.activeElement.id;
  $("#view").innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">${({today:vToday,leave:()=>vReq("leave"),trip:()=>vReq("trip"),duty:vDuty,report:vReport,staff:vStaff,eval:vEval,month:vMonth,daily:vDaily,setup:vSetup})[v]()}</div>`;
  Object.entries(keep).forEach(([id,val]) => { const el = document.getElementById(id); if(!el || !el.closest("[data-keep]")) return; if(el.type==="checkbox") el.checked = val; else el.value = val; });

/* ---------- actions ---------- */
function openSheet(html){ const sh = $("#sheet"); sh.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`; sh.hidden = false; }
function closeSheet(){ $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") closeSheet(); });

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a==="goto"){ location.hash = el.dataset.to; }
  if(a==="demo") enterDemo();
  if(a==="logout") window.HR.logout();
  if(a==="setGeo"){
    const m = $("#geoMsg"); el.disabled = true; m.textContent = "กำลังหาตำแหน่ง…";
    try { const p = await locate(); if(p.acc > 60){ m.textContent = `GPS คลาดเคลื่อน ${Math.round(p.acc)} ม. ลองใหม่ในที่โล่ง`; el.disabled = false; return; }
      S.geo = await window.HR.setGeo({lat:p.lat, lng:p.lng, radius:Number($("#gRad").value)||150}); toast("ตั้งพิกัด รพ.สต. แล้ว"); render(); }
    catch(err){ m.textContent = err.message; el.disabled = false; }
  }
  if(a==="exitDemo") exitDemo();
  if(a==="punch"){
    const s = S.staff.find(x=>x.id===id); const t = hm(new Date()); const kind = el.dataset.kind;

      <div class="big">${t} น.</div><div class="muted" style="text-align:center">${esc(thDate(new Date()))}</div>
      ${S.demo?"":`<div class="gpsbox" id="gpsInfo">กำลังหาตำแหน่งของคุณ…</div>`}
      <div class="acts"><button data-act="cancel">ยกเลิก</button><button class="primary" data-act="confirmPunch" data-id="${id}" data-kind="${kind}" id="punchGo" ${S.demo?"":"disabled"}>ยืนยัน</button></div>`);
    if(!S.demo) locate().then(p => { S.pos = p; const g = $("#gpsInfo"), b = $("#punchGo"); if(!g) return;
      g.textContent = `ได้ตำแหน่งแล้ว (คลาดเคลื่อนประมาณ ${Math.round(p.acc)} ม.) เวลาจะใช้ตามเซิร์ฟเวอร์`; if(b) b.disabled = false; })
      .catch(err => { const g = $("#gpsInfo"); if(g) g.innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span> <button data-act="punch" data-kind="${kind}" data-id="${id}">ลองใหม่</button>`; });
  }
  if(a==="cancel") closeSheet();

    if(S.demo){ closeSheet(); try { await writeLog(dkey(new Date()), id, {[kind]: t}); toast(`${s?s.name:""} ลงเวลา${kind==="in"?"เข้า":"ออก"} ${t} น. แล้ว`); } catch(_){} return; }
    el.disabled = true; const g = $("#gpsInfo"); if(g) g.textContent = "กำลังบันทึก…";
    try { const r = await window.HR.punch(kind, S.pos);
      if(r.ok){ closeSheet(); toast(`ลงเวลา${kind==="in"?"เข้า":"ออก"} ${r.time} น. แล้ว`+(r.meters!==""&&r.meters!=null?` (ห่าง ${r.meters} ม.)`:"")); }
      else { if(g) g.innerHTML = `<span style="color:var(--bad)">ไม่ได้บันทึก: ${esc(r.reason)}</span>`; }
    } catch(err){ if(g) g.innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`; el.disabled = false; }
  }
  if(a==="mshift"){ const d = parseKey(S.monthKey+"-01"); d.setMonth(d.getMonth()+Number(el.dataset.d)); S.monthKey = dkey(d).slice(0,7); if(S.demo) render(); else subscribeMonth(); render(); }
  if(a==="dshift"){ const d = parseKey(S.dailyKey); d.setDate(d.getDate()+Number(el.dataset.d)); setDaily(dkey(d)); }
  if(a==="openday"){ setDaily(el.dataset.k); location.hash = "daily"; }

  }

    openSheet(`<h2>นำ ${esc(s.name)} ออกจากรายชื่อ?</h2><p class="muted" style="margin:0">ประวัติการลงเวลาเดิมยังเก็บไว้ แต่จะไม่แสดงในหน้าลงเวลาและสรุปอีก</p>

/* ---------- import from Google Sheets GPS log ---------- */
const normName = x => String(x||"").replace(/\s+/g," ").trim();
function parseImport(text){
  const lines = String(text||"").split(/\r?\n/).filter(l => l.trim());
  if(!lines.length){ S.importRows = []; S.importInfo = "ยังไม่มีข้อมูลที่วาง"; return; }
  const split = l => l.includes("\t") ? l.split("\t") : l.split(",").map(x => x.replace(/^"|"$/g,""));
  let idx = {date:1, time:2, name:4, kind:5, status:10}, start = 0;
  const head = split(lines[0]).map(x => x.trim());
  if(head.includes("วันที่")){ const f = n => head.indexOf(n); idx = {date:f("วันที่"), time:f("เวลา"), name:f("ชื่อ-สกุล"), kind:f("ประเภท"), status:f("สถานะ")}; start = 1; }
  const byName = new Map(S.staff.map(s => [normName(s.name), s]));
  const agg = {}, unknown = new Set(); let skipped = 0;
  lines.slice(start).forEach(l => {
    const c = split(l); const st = idx.status>=0 ? (c[idx.status]||"").trim() : "สำเร็จ";
    const date = (c[idx.date]||"").trim(), time = (c[idx.time]||"").trim().slice(0,5), kind = (c[idx.kind]||"").trim();
    if(st !== "สำเร็จ" || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !/^\d{1,2}:\d{2}$/.test(time)){ skipped++; return; }
    const s = byName.get(normName(c[idx.name])); if(!s){ unknown.add(normName(c[idx.name])); return; }
    const t = time.padStart(5,"0"), key = date+"_"+s.id, a = agg[key] || (agg[key] = {date, staffId:s.id});
    if(kind==="เข้า" && (!a.in || t < a.in)) a.in = t;
    if(kind==="ออก" && (!a.out || t > a.out)) a.out = t;
  });
  S.importRows = Object.values(agg);
  S.importInfo = `พบ ${S.importRows.length} รายการ (คน-วัน)` + (skipped?` · ข้าม ${skipped} แถว`:"") + (unknown.size?` · ไม่พบชื่อในแดชบอร์ด: ${[...unknown].slice(0,5).join(", ")}${unknown.size>5?" …":""}`:"");
}
async function runImport(){
  const rows = S.importRows || []; let n = 0;
  for(const r of rows){
    const id = r.date+"_"+r.staffId;
    let cur = S.today[id] || S.month[id] || (S.daily||{})[id] || null;
    if(!S.demo && !cur){ try { const d = await S.db.doc("logs/"+id).get(); cur = d.exists ? d.data() : null; } catch(_){} }
    cur = cur || {};
    if(cur.leave) continue;
    const patch = {via:"gps"};
    if(r.in && (!cur.in || r.in < cur.in)) patch.in = r.in;
    if(r.out && (!cur.out || r.out > cur.out)) patch.out = r.out;
    if(!patch.in && !patch.out) continue;
    const body = {...cur, ...patch, date:r.date, staffId:r.staffId, updatedAt:new Date().toISOString()};
    if(S.demo){ if(r.date===dkey(new Date())) S.today[id]=body; if(r.date.slice(0,7)===S.monthKey) S.month[id]=body; if(r.date===S.dailyKey) (S.daily=S.daily||{})[id]=body; n++; continue; }
    try { await S.db.doc("logs/"+id).set(body); n++; } catch(e){ handleWriteError(e); break; }
  }
  S.importRows = []; S.importInfo = `นำเข้าแล้ว ${n} รายการ`; const t = $("#impText"); if(t) t.value = "";
  render(); toast(`นำเข้าเวลาจาก Google Sheets แล้ว ${n} รายการ`);
}

/* ---------- clock ---------- */
function tick(){
  const n = new Date(); $("#clk").textContent = hm(n)+":"+pad(n.getSeconds()); $("#clkDate").textContent = thDate(n);
  if(S.todayKeySub && S.todayKeySub !== dkey(n)) { subscribeToday(); }
  if(n.getSeconds()===0 && view()==="today") render();
}
setInterval(tick, 1000); tick();
window.addEventListener("hashchange", render);

/* ---------- boot ---------- */
window.HR.toast = toast;
window.HR.onDemo = () => { enterDemo(); };
S.evalRound = curRound();
render();
(async () => {
  const [db, user] = await Promise.all([claude.use("db").catch(()=>null), claude.use("user").catch(()=>null)]);
  S.user = user;
  claude.use("sample").then(sm => { S.sample = sm; render(); }).catch(()=>{});
  if(!db){ S.noDb = true; S.loadFailed = true; render(); return; }
  S.db = db;
  if(user){
    try { const c = await user.can("data.write"); if(c===false) S.canWrite = false; } catch(_){}
    try { S.isAdmin = !!(await user.canEdit()); } catch(_){}
    try { S.me = await user.id(); } catch(_){}
  }
  if(!S.demo) subscribeAll();
  if(S.isAdmin) window.HR.geo().then(g => { S.geo = g; render(); }).catch(()=>{});
})();
})();
</script>
